name: task-manager-smoke

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_manager_user
      POSTGRES_PASSWORD: ci_task_manager_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8025/api/v1/info || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    image: task-manager/backend:ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:postgresql://postgres:5432/task_manager
      DB_USERNAME: task_manager_user
      DB_PASSWORD: ci_task_manager_password
      JWT_SECRET: Q2ktc21va2UtdGVzdC1KV1Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=
      JWT_ACCESS_TOKEN_TTL: PT15M
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEDULER_API_KEY: ci-smoke-test-scheduler-api-key
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8081/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  email-sender:
    image: task-manager/email-sender:ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: noreply@task-manager.ci
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_manager_user
      POSTGRES_PASSWORD: ci_task_manager_password
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8082/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  scheduler-service:
    image: task-manager/scheduler-service:ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:postgresql://postgres:5432/task_manager
      DB_USERNAME: task_manager_user
      DB_PASSWORD: ci_task_manager_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8083/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  summarization-service:
    image: task-manager/summarization-service:ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEEPSEEK_BASE_URL: http://deepseek-disabled
      DEEPSEEK_API_KEY: ci-not-a-real-deepseek-key
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8084/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s