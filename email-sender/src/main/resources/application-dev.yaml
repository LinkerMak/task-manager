spring:
  config:
    import: optional:file:./email-sender/.env.email.sender.local[.properties]

  kafka:
    topics:
      email-sending-tasks: email-sending-tasks
      email-sending-tasks-dlt: email-sending-tasks-dlt

    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: email-sender
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.trusted.packages: org.example.taskmanager.contracts.email
        spring.json.value.default.type: org.example.taskmanager.contracts.email.EmailSendingTask
        spring.json.use.type.headers: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  app:
    mail:
      from: ${MAIL_FROM:noreply@task-manager.local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_manager}?currentSchema=email_sender_schema
    username: ${POSTGRES_USER:task_manager_user}
    password: ${POSTGRES_PASSWORD}


management:
  server:
    port: 8082