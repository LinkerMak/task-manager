spring:
  config:
    import: optional:file:./email-sender/.env.email.sender.local[.properties]

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: email-sender
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.trusted.packages: org.example.taskmanager.contracts.email
        spring.json.value.default.type: org.example.taskmanager.contracts.email.EmailSendingTask
        spring.json.use.type.headers: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  app:
    mail:
      from: ${MAIL_FROM:noreply@task-manager.local}

  datasource:
    url: jdbc:postgresql://${EMAIL_SENDER_DB_HOST:localhost}:${EMAIL_SENDER_DB_PORT:5434}/${EMAIL_SENDER_DB_NAME:email_sender_db}
    username: ${EMAIL_SENDER_DB_USERNAME:email_sender_user}
    password: ${EMAIL_SENDER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration