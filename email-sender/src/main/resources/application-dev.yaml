spring:
  config:
    import: optional:file:./email-sender/.env.email.sender.local[.properties]

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: email-sender
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.email.sender.messaging.model
        spring.json.value.default.type: com.example.emailsender.messaging.model.EmailSendingTask
        spring.json.use.type.headers: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  app:
    mail:
      from: ${MAIL_FROM:noreply@task-manager.local}
